openapi: 3.1.0
info:
  description: API do app MoveUp. Erros em application/problem+json (RFC 9457) com
    `code` estável.
  title: MoveUp API
  version: v1
servers:
- url: /
security:
- bearerAuth: []
tags:
- description: Conta do usuário autenticado
  name: accounts
- description: Consentimentos do usuário (LGPD)
  name: consents
- description: Convite do ponto de vista do aluno
  name: invites
- description: Alunos e vínculos do profissional
  name: clients
paths:
  /v1/accounts:
    post:
      description: Primeira chamada depois do login no provedor. O e-mail vem do token.
        Profissional ganha organização e período de teste; aluno informa a data de
        nascimento.
      operationId: registerAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAccount"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: Conta criada
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Login ou e-mail já cadastrado (`account-already-registered`)
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Dado inválido: `email-required`, `name-invalid`, `role-invalid`,\
            \ `birth-date-required`, `birth-date-invalid`, `professional-must-be-adult`,\
            \ `business-name-invalid`, `registry-number-invalid`"
      summary: Cria a conta do usuário logado
      tags:
      - accounts
  /v1/clients:
    get:
      description: "Pendentes, ativos e inativos, do mais novo ao mais antigo, por\
        \ cursor."
      operationId: listClients
      parameters:
      - in: query
        name: cursor
        required: false
        schema:
          type: string
          format: uuid
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientPage"
          description: Página de alunos
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conta não é de profissional (`forbidden`)
      summary: Alunos do profissional
      tags:
      - clients
    post:
      description: Cria aluno + vínculo pendente + convite (7 dias). Exige vaga no
        plano.
      operationId: inviteClient
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewClient"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
          description: Convite criado
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conta não é de profissional (`forbidden`)
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Plano sem vaga (`plan-limit-reached`)
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`name-invalid`, `email-invalid`, `phone-invalid`, `goal-invalid`"
      summary: Pré-cadastra um aluno e gera o convite
      tags:
      - clients
  /v1/clients/{linkId}/invite:
    delete:
      operationId: cancelInvite
      parameters:
      - in: path
        name: linkId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Convite cancelado
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conta não é de profissional (`forbidden`)
      summary: Cancela o convite pendente
      tags:
      - clients
    post:
      description: Cancela o convite pendente e gera outro (o link anterior deixa
        de valer).
      operationId: resendInvite
      parameters:
      - in: path
        name: linkId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
          description: Convite novo
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conta não é de profissional (`forbidden`)
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Vínculo não está pendente (`link-state-invalid`)
      summary: Reenvia o convite
      tags:
      - clients
  /v1/coaching-links/{linkId}/end:
    post:
      operationId: endLink
      parameters:
      - in: path
        name: linkId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Encerrado
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conta não é de profissional (`forbidden`)
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Vínculo de outro profissional ou inexistente (`resource-not-found`)
      summary: Encerra o vínculo
      tags:
      - clients
  /v1/coaching-links/{linkId}/inactivate:
    post:
      description: Libera a vaga do plano; o histórico continua visível para reativar.
      operationId: inactivateLink
      parameters:
      - in: path
        name: linkId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Inativado
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conta não é de profissional (`forbidden`)
      summary: Inativa o aluno
      tags:
      - clients
  /v1/coaching-links/{linkId}/reactivate:
    post:
      operationId: reactivateLink
      parameters:
      - in: path
        name: linkId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Reativado
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conta não é de profissional (`forbidden`)
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`plan-limit-reached` ou `link-state-invalid`'
      summary: Reativa o aluno (exige vaga no plano)
      tags:
      - clients
  /v1/consents:
    post:
      description: "Cada aceite guarda a versão do texto, o IP e o app (prova do consentimento)."
      operationId: grantConsents
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantConsents"
        required: true
      responses:
        "204":
          description: Aceites registrados
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Login sem cadastro (`account-not-registered`)
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Versão do texto desatualizada (`consent-version-outdated`)
      summary: Registra aceites
      tags:
      - consents
  /v1/consents/{kind}:
    delete:
      description: Direito do titular (LGPD). O histórico do aceite é mantido.
      operationId: revokeConsent
      parameters:
      - in: path
        name: kind
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Revogado (ou já não havia aceite vigente)
      summary: Revoga um aceite
      tags:
      - consents
  /v1/guardian-consent:
    post:
      description: "Obrigatório para menores de 18 anos antes de aceitar convite (LGPD,\
        \ art. 14). Os dados do responsável só são visíveis para o próprio aluno."
      operationId: declareGuardianConsent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuardianConsent"
        required: true
      responses:
        "204":
          description: Consentimento registrado
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`guardian-consent-not-required` (conta de maior), `guardian-consent-already-active`\
            \ ou `consent-version-outdated`"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`guardian-email-invalid`, `relationship-invalid`, `name-invalid`"
      summary: Consentimento do responsável pelo aluno menor
      tags:
      - consents
  /v1/invites/{code}:
    get:
      description: "\"Ana Souza quer ser seu personal\", antes de aceitar."
      operationId: previewInvite
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
          description: Convite válido
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Inválido, usado, cancelado ou expirado (`invite-expired`)"
      summary: De quem é o convite
      tags:
      - invites
  /v1/invites/{code}/accept:
    post:
      description: "Exige conta de aluno com termos aceitos (e responsável, se menor).\
        \ Troca de personal: o cadastro do aluno é reaproveitado."
      operationId: acceptInvite
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedInvite"
          description: Vínculo ativo
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`invite-expired`, `plan-limit-reached`, `client-already-linked`,\
            \ `onboarding-incomplete`, `invite-for-clients-only`"
      summary: Aceita o convite
      tags:
      - invites
  /v1/legal-documents:
    get:
      description: O app mostra estes textos e manda a versão aceita em POST /v1/consents.
      operationId: getLegalVersions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalVersions"
          description: Versões vigentes
      summary: Versões vigentes dos textos legais
      tags:
      - consents
  /v1/me:
    get:
      description: "Devolve a conta ligada ao token. Login válido sem cadastro no\
        \ MoveUp responde 404 com `account-not-registered`: o app leva ao cadastro."
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: Conta encontrada
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Sem token ou token inválido (`unauthenticated`)
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Login sem cadastro (`account-not-registered`)
      summary: Conta do usuário autenticado
      tags:
      - accounts
  /v1/me/coaching-links:
    get:
      description: "Não encerrados, do mais recente ao mais antigo. Vazio = aluno\
        \ sem personal."
      operationId: getMyCoachingLinks
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyCoachingLink"
          description: Vínculos do aluno
      summary: Vínculos do aluno
      tags:
      - invites
  /v1/me/coaching-links/{linkId}/end:
    post:
      operationId: endMyLink
      parameters:
      - in: path
        name: linkId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Encerrado
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Vínculo inexistente, de outro aluno ou já encerrado (`resource-not-found`)"
      summary: O aluno encerra o próprio vínculo
      tags:
      - invites
components:
  schemas:
    AcceptedInvite:
      type: object
      properties:
        linkId:
          type: string
          format: uuid
      required:
      - linkId
    ClientItem:
      type: object
      properties:
        clientId:
          type: string
          format: uuid
        linkId:
          type: string
          format: uuid
        name:
          type: string
        pendingInvite:
          type: "null"
          $ref: "#/components/schemas/ClientPendingInvite"
          description: Só para pendentes com convite válido
        startedAt:
          type:
          - string
          - "null"
          format: date-time
        status:
          type: string
          enum:
          - pending
          - active
          - inactive
      required:
      - clientId
      - linkId
      - name
      - status
    ClientPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClientItem"
        nextCursor:
          type:
          - string
          - "null"
          format: uuid
          description: Passe em ?cursor= para a próxima página
      required:
      - items
    ClientPendingInvite:
      type: object
      properties:
        code:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
      - code
      - expiresAt
    ConsentGrant:
      type: object
      properties:
        docVersion:
          type: string
          maxLength: 50
          minLength: 0
        kind:
          type: string
          enum:
          - terms
          - privacy
          - health_data
          - photos
          minLength: 1
      required:
      - docVersion
      - kind
    FieldProblem:
      type: object
      properties:
        code:
          type: string
          example: min
        field:
          type: string
          example: reps.max
        message:
          type: string
      required:
      - code
      - field
      - message
    GrantConsents:
      type: object
      properties:
        grants:
          type: array
          items:
            $ref: "#/components/schemas/ConsentGrant"
          maxItems: 4
          minItems: 0
      required:
      - grants
    GuardianConsent:
      type: object
      properties:
        docVersion:
          type: string
          maxLength: 50
          minLength: 0
        guardianEmail:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        guardianName:
          type: string
          maxLength: 200
          minLength: 0
        relationship:
          type: string
          enum:
          - mother
          - father
          - legal_guardian
          - other
          minLength: 1
      required:
      - docVersion
      - guardianEmail
      - guardianName
      - relationship
    Invitation:
      type: object
      description: "Convite para compartilhar (link, código ou QR)"
      properties:
        clientId:
          type: string
          format: uuid
        code:
          type: string
          example: K7M2QX9P
        expiresAt:
          type: string
          format: date-time
        linkId:
          type: string
          format: uuid
        url:
          type: string
          example: https://moveup.com.br/i/K7M2QX9P
      required:
      - clientId
      - code
      - expiresAt
      - linkId
      - url
    InvitePreview:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
        organizationName:
          type: string
          example: Studio Fit
        professionalName:
          type: string
          example: Ana Souza
      required:
      - expiresAt
      - organizationName
      - professionalName
    LegalVersions:
      type: object
      properties:
        consents:
          type: object
          additionalProperties:
            type: string
          description: "Versão vigente por tipo (terms, privacy, health_data, photos)"
        guardianConsent:
          type: string
      required:
      - consents
      - guardianConsent
    Me:
      type: object
      description: Conta do usuário autenticado e o que falta no onboarding
      properties:
        email:
          type: string
          format: email
        guardianConsentRequired:
          type: boolean
          description: "Menor sem consentimento do responsável vigente: o app pede\
            \ antes de seguir"
        id:
          type: string
          format: uuid
        lengthUnit:
          type: string
          enum:
          - cm
          - in
        locale:
          type: string
          example: pt-BR
        minor:
          type: boolean
          description: Menor de 18 anos
        missingConsents:
          type: array
          description: Consentimentos obrigatórios ainda não aceitos na versão vigente
          items:
            type: string
            enum:
            - terms
            - privacy
            - health_data
            - photos
        name:
          type: string
        role:
          type:
          - string
          - "null"
          description: Papel da conta; ausente se o cadastro não escolheu
          enum:
          - professional
          - client
        timezone:
          type: string
          example: America/Sao_Paulo
        weightUnit:
          type: string
          enum:
          - kg
          - lb
      required:
      - email
      - guardianConsentRequired
      - id
      - lengthUnit
      - locale
      - minor
      - missingConsents
      - name
      - timezone
      - weightUnit
    MyCoachingLink:
      type: object
      properties:
        linkId:
          type: string
          format: uuid
        organizationName:
          type: string
          example: Studio Fit
        professionalName:
          type: string
          example: Ana Souza
        startedAt:
          type:
          - string
          - "null"
          format: date-time
        status:
          type: string
          enum:
          - pending
          - active
          - inactive
      required:
      - linkId
      - organizationName
      - professionalName
      - status
    NewClient:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        goal:
          type: string
          maxLength: 500
          minLength: 0
        name:
          type: string
          maxLength: 200
          minLength: 0
        phone:
          type: string
          description: WhatsApp com DDI e DDD
          example: +55 11 98765-4321
          maxLength: 30
          minLength: 0
      required:
      - name
    Problem:
      type: object
      description: Erro no formato RFC 9457 (application/problem+json)
      properties:
        code:
          type: string
          description: Código estável (kebab-case) que o app usa para escolher a mensagem
          example: resource-not-found
        detail:
          type: string
          example: Recurso não encontrado.
        errors:
          type: array
          description: Só em erros de validação (400)
          items:
            $ref: "#/components/schemas/FieldProblem"
        instance:
          type: string
          example: /v1/me
        status:
          type: integer
          format: int32
          example: 404
        title:
          type: string
          example: Recurso não encontrado
        traceId:
          type: string
          example: 4bf92f3577b34da6a3ce929d0e0e4736
        type:
          type: string
          example: https://api.moveup.com.br/problems/resource-not-found
      required:
      - code
      - detail
      - status
      - title
      - traceId
      - type
    RegisterAccount:
      type: object
      properties:
        birthDate:
          type: string
          format: date
          description: Obrigatória para aluno (decide se precisa do responsável)
        businessName:
          type: string
          description: Só profissional; vazio usa o nome da pessoa
          maxLength: 120
          minLength: 0
        name:
          type: string
          maxLength: 200
          minLength: 0
        registryNumber:
          type: string
          description: Só profissional; CREF
          maxLength: 30
          minLength: 0
        role:
          type: string
          enum:
          - professional
          - client
          minLength: 1
          pattern: professional|client
      required:
      - name
      - role
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: ID token do Firebase Auth
      scheme: bearer
      type: http
