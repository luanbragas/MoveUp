openapi: 3.1.0
info:
  description: API do app MoveUp. Erros em application/problem+json (RFC 9457) com
    `code` estável.
  title: MoveUp API
  version: v1
servers:
- url: /
security:
- bearerAuth: []
tags:
- description: Conta do usuário autenticado
  name: accounts
- description: Consentimentos do usuário (LGPD)
  name: consents
- description: Treinos e modelos
  name: workouts
- description: Convite do ponto de vista do aluno
  name: invites
- description: Autorização do responsável pelo menor
  name: guardian-authorizations
- description: Alunos e vínculos do profissional
  name: clients
- description: Biblioteca de exercícios
  name: exercises
paths:
  /v1/accounts:
    post:
      description: Primeira chamada depois do login no provedor. O e-mail vem do token.
        Profissional ganha organização e período de teste; aluno informa a data de
        nascimento.
      operationId: registerAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAccount"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: Conta criada
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Login ou e-mail já cadastrado (`account-already-registered`)
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Dado inválido: `email-required`, `name-invalid`, `role-invalid`,\
            \ `birth-date-required`, `birth-date-invalid`, `professional-must-be-adult`,\
            \ `business-name-invalid`, `registry-number-invalid`"
      summary: Cria a conta do usuário logado
      tags:
      - accounts
  /v1/clients:
    get:
      description: "Pendentes, ativos e inativos, do mais novo ao mais antigo, por\
        \ cursor."
      operationId: listClients
      parameters:
      - in: query
        name: cursor
        required: false
        schema:
          type: string
          format: uuid
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientPage"
          description: Página de alunos
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conta não é de profissional (`forbidden`)
      summary: Alunos do profissional
      tags:
      - clients
    post:
      description: Cria aluno + vínculo pendente + convite (7 dias). Exige vaga no
        plano.
      operationId: inviteClient
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewClient"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
          description: Convite criado
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conta não é de profissional (`forbidden`)
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Plano sem vaga (`plan-limit-reached`)
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`name-invalid`, `email-invalid`, `phone-invalid`, `goal-invalid`"
      summary: Pré-cadastra um aluno e gera o convite
      tags:
      - clients
  /v1/clients/seats:
    get:
      description: Alunos ativos e o limite do plano vivo ("7 de 10 vagas").
      operationId: getClientSeats
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSeats"
          description: Vagas
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conta não é de profissional (`forbidden`)
      summary: Vagas do plano
      tags:
      - clients
  /v1/clients/{linkId}/invite:
    delete:
      operationId: cancelInvite
      parameters:
      - in: path
        name: linkId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Convite cancelado
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conta não é de profissional (`forbidden`)
      summary: Cancela o convite pendente
      tags:
      - clients
    post:
      description: Cancela o convite pendente e gera outro (o link anterior deixa
        de valer).
      operationId: resendInvite
      parameters:
      - in: path
        name: linkId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
          description: Convite novo
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conta não é de profissional (`forbidden`)
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Vínculo não está pendente (`link-state-invalid`)
      summary: Reenvia o convite
      tags:
      - clients
  /v1/coaching-links/{linkId}/end:
    post:
      operationId: endLink
      parameters:
      - in: path
        name: linkId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Encerrado
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conta não é de profissional (`forbidden`)
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Vínculo de outro profissional ou inexistente (`resource-not-found`)
      summary: Encerra o vínculo
      tags:
      - clients
  /v1/coaching-links/{linkId}/inactivate:
    post:
      description: Libera a vaga do plano; o histórico continua visível para reativar.
      operationId: inactivateLink
      parameters:
      - in: path
        name: linkId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Inativado
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conta não é de profissional (`forbidden`)
      summary: Inativa o aluno
      tags:
      - clients
  /v1/coaching-links/{linkId}/reactivate:
    post:
      operationId: reactivateLink
      parameters:
      - in: path
        name: linkId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Reativado
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conta não é de profissional (`forbidden`)
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`plan-limit-reached` ou `link-state-invalid`'
      summary: Reativa o aluno (exige vaga no plano)
      tags:
      - clients
  /v1/consents:
    post:
      description: "Cada aceite guarda a versão do texto, o IP e o app (prova do consentimento)."
      operationId: grantConsents
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantConsents"
        required: true
      responses:
        "204":
          description: Aceites registrados
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Login sem cadastro (`account-not-registered`)
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Versão do texto desatualizada (`consent-version-outdated`)
      summary: Registra aceites
      tags:
      - consents
  /v1/consents/{kind}:
    delete:
      description: Direito do titular (LGPD). O histórico do aceite é mantido.
      operationId: revokeConsent
      parameters:
      - in: path
        name: kind
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Revogado (ou já não havia aceite vigente)
      summary: Revoga um aceite
      tags:
      - consents
  /v1/exercises:
    get:
      description: "Base do MoveUp + exercícios próprios. Busca por parte do nome\
        \ ou nome parecido, sem acento; filtro opcional por músculo (principal ou\
        \ secundário)."
      operationId: searchExercises
      parameters:
      - in: query
        name: q
        required: false
        schema:
          type: string
      - in: query
        name: muscle
        required: false
        schema:
          type: string
          enum:
          - chest
          - delts
          - traps
          - abs
          - lats
          - biceps
          - triceps
          - forearms
          - quads
          - adductors
          - abductors
          - calves
          - lowerback
          - glutes
          - hamstrings
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Exercise"
          description: Até `limit` exercícios (máx. 100)
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conta não é de profissional (`forbidden`)
      summary: Busca na biblioteca
      tags:
      - exercises
    post:
      operationId: createExercise
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewExercise"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercise"
          description: Exercício criado
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conta não é de profissional (`forbidden`)
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`exercise-name-taken`'
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`exercise-name-invalid`, `modality-invalid`, `tracking-type-invalid`,\
            \ `muscle-invalid`, `instructions-invalid`, `media-url-invalid`"
      summary: Cria um exercício próprio
      tags:
      - exercises
  /v1/exercises/{exerciseId}:
    delete:
      description: Some da busca; treinos que já usam continuam mostrando.
      operationId: archiveExercise
      parameters:
      - in: path
        name: exerciseId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Arquivado
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conta não é de profissional (`forbidden`)
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`base-exercise-read-only`'
      summary: Arquiva um exercício próprio
      tags:
      - exercises
  /v1/guardian-authorizations/decision:
    post:
      description: "Guarda quando, o IP e o navegador como prova (LGPD). O link vale\
        \ uma vez: depois da decisão responde 404."
      operationId: decideGuardianAuthorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuardianAuthorizationDecision"
        required: true
      responses:
        "204":
          description: Decisão registrada
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`guardian-authorization-not-found` (link inválido, vencido\
            \ ou já usado)"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`consent-version-outdated` (o termo mudou: recarregar a pá\
            gina)"
      security: []
      summary: Responsável autoriza ou recusa
      tags:
      - guardian-authorizations
  /v1/guardian-authorizations/preview:
    post:
      description: Só o primeiro nome do menor e quem ele indicou; nenhum dado de
        saúde.
      operationId: previewGuardianAuthorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuardianAuthorizationLookup"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianAuthorizationPreview"
          description: Pedido aguardando a decisão
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`guardian-authorization-not-found` (link inválido, vencido\
            \ ou já usado)"
      security: []
      summary: "Pedido de autorização, pelo link"
      tags:
      - guardian-authorizations
  /v1/guardian-consent:
    delete:
      description: Para indicar outra pessoa. O link enviado deixa de valer.
      operationId: cancelGuardianRequest
      responses:
        "204":
          description: Pedido cancelado
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`guardian-request-not-pending` (nenhum pedido aguardando o
            responsável)'
      summary: Cancela o pedido ao responsável
      tags:
      - consents
    post:
      description: "Obrigatório para menores de 18 anos antes de aceitar convite (LGPD,\
        \ art. 14). O menor indica quem é o responsável e recebe o link para mandar\
        \ a essa pessoa; só vale quando o responsável autoriza pelo link. Os dados\
        \ do responsável só são visíveis para o próprio aluno."
      operationId: requestGuardianConsent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuardianRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianLink"
          description: Pedido criado; link para o responsável
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`guardian-consent-not-required` (conta de maior), `guardian-consent-already-active`\
            \ (já há pedido aberto ou autorização) ou `consent-version-outdated`"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`relationship-invalid`, `name-invalid`"
      summary: Menor pede a autorização do responsável
      tags:
      - consents
  /v1/guardian-consent/link:
    post:
      description: Para reenviar o pedido. O link anterior deixa de valer.
      operationId: resendGuardianLink
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianLink"
          description: Link novo
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`guardian-request-not-pending` (nenhum pedido aguardando o
            responsável)'
      summary: Novo link para o responsável
      tags:
      - consents
  /v1/invites/{code}:
    get:
      description: "\"Ana Souza quer ser seu personal\", antes de aceitar."
      operationId: previewInvite
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
          description: Convite válido
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Inválido, usado, cancelado ou expirado (`invite-expired`)"
      summary: De quem é o convite
      tags:
      - invites
  /v1/invites/{code}/accept:
    post:
      description: "Exige conta de aluno com termos aceitos (e responsável, se menor).\
        \ Troca de personal: o cadastro do aluno é reaproveitado."
      operationId: acceptInvite
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedInvite"
          description: Vínculo ativo
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`invite-expired`, `plan-limit-reached`, `client-already-linked`,\
            \ `onboarding-incomplete`, `invite-for-clients-only`"
      summary: Aceita o convite
      tags:
      - invites
  /v1/legal-documents:
    get:
      description: O app mostra estes textos e manda a versão aceita em POST /v1/consents.
      operationId: getLegalVersions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalVersions"
          description: Versões vigentes
      summary: Versões vigentes dos textos legais
      tags:
      - consents
  /v1/me:
    get:
      description: "Devolve a conta ligada ao token. Login válido sem cadastro no\
        \ MoveUp responde 404 com `account-not-registered`: o app leva ao cadastro."
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: Conta encontrada
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Sem token ou token inválido (`unauthenticated`)
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Login sem cadastro (`account-not-registered`)
      summary: Conta do usuário autenticado
      tags:
      - accounts
  /v1/me/coaching-links:
    get:
      description: "Não encerrados, do mais recente ao mais antigo. Vazio = aluno\
        \ sem personal."
      operationId: getMyCoachingLinks
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyCoachingLink"
          description: Vínculos do aluno
      summary: Vínculos do aluno
      tags:
      - invites
  /v1/me/coaching-links/{linkId}/end:
    post:
      operationId: endMyLink
      parameters:
      - in: path
        name: linkId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Encerrado
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Vínculo inexistente, de outro aluno ou já encerrado (`resource-not-found`)"
      summary: O aluno encerra o próprio vínculo
      tags:
      - invites
  /v1/workout-templates:
    get:
      description: Do editado mais recente ao mais antigo; sem os arquivados.
      operationId: listWorkoutTemplates
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkoutSummary"
          description: Modelos
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conta não é de profissional (`forbidden`)
      summary: Modelos da organização
      tags:
      - workouts
    post:
      operationId: createWorkoutTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutWrite"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workout"
          description: Modelo criado (cabeçalho ETag com a revisão)
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conta não é de profissional (`forbidden`)
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Regra do treino (`block-empty`, `superset-needs-two`, `exercise-unknown`…\
            )"
      summary: Cria um modelo de treino
      tags:
      - workouts
  /v1/workouts/{workoutId}:
    delete:
      description: Some das listas e do app do aluno; sessões antigas continuam.
      operationId: archiveWorkout
      parameters:
      - in: path
        name: workoutId
        required: true
        schema:
          type: string
          format: uuid
      - description: '"r<revision>" da última leitura'
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Arquivado
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conta não é de profissional (`forbidden`)
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`version-mismatch`'
      summary: Arquiva o treino
      tags:
      - workouts
    get:
      operationId: getWorkout
      parameters:
      - in: path
        name: workoutId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workout"
          description: Treino (cabeçalho ETag com a revisão)
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conta não é de profissional (`forbidden`)
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "`resource-not-found` (inexistente, arquivado ou de outra organizaç\
            ão)"
      summary: Treino com o conteúdo da versão atual
      tags:
      - workouts
    put:
      description: "Se a versão atual já foi usada numa sessão, cria versão nova (a\
        \ sessão continua comparando com o planejado dela); senão, substitui a atual."
      operationId: saveWorkout
      parameters:
      - in: path
        name: workoutId
        required: true
        schema:
          type: string
          format: uuid
      - description: '"r<revision>" da última leitura'
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutWrite"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workout"
          description: Treino salvo (cabeçalho ETag com a revisão)
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conta não é de profissional (`forbidden`)
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`version-mismatch` (salvo em outro aparelho)'
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Regra do treino
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: '`if-match-required`'
      summary: Salva o treino inteiro
      tags:
      - workouts
components:
  schemas:
    AcceptedInvite:
      type: object
      properties:
        linkId:
          type: string
          format: uuid
      required:
      - linkId
    ClientItem:
      type: object
      properties:
        clientId:
          type: string
          format: uuid
        linkId:
          type: string
          format: uuid
        name:
          type: string
        pendingInvite:
          type: "null"
          $ref: "#/components/schemas/ClientPendingInvite"
          description: Só para pendentes com convite válido
        startedAt:
          type:
          - string
          - "null"
          format: date-time
        status:
          type: string
          enum:
          - pending
          - active
          - inactive
      required:
      - clientId
      - linkId
      - name
      - status
    ClientPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClientItem"
        nextCursor:
          type:
          - string
          - "null"
          format: uuid
          description: Passe em ?cursor= para a próxima página
      required:
      - items
    ClientPendingInvite:
      type: object
      properties:
        code:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
      - code
      - expiresAt
    ClientSeats:
      type: object
      properties:
        active:
          type: integer
          format: int32
          description: Alunos ativos (contam no plano)
        limit:
          type:
          - integer
          - "null"
          format: int32
          description: Limite do plano; ausente sem assinatura viva
      required:
      - active
    ConsentGrant:
      type: object
      properties:
        docVersion:
          type: string
          maxLength: 50
          minLength: 0
        kind:
          type: string
          enum:
          - terms
          - privacy
          - health_data
          - photos
          minLength: 1
      required:
      - docVersion
      - kind
    Exercise:
      type: object
      properties:
        custom:
          type: boolean
          description: Exercício próprio (pode arquivar)
        equipment:
          type:
          - string
          - "null"
        id:
          type: string
          format: uuid
        instructions:
          type:
          - string
          - "null"
          description: Como executar
        mediaUrl:
          type:
          - string
          - "null"
          description: Vídeo (link https)
        modality:
          type: string
          enum:
          - strength
          - cardio
          - conditioning
          - complementary
        name:
          type: string
        primaryMuscle:
          type:
          - string
          - "null"
          description: Código do mapa muscular
        secondaryMuscles:
          type: array
          items:
            type: string
        trackingType:
          type: string
          description: O que o aluno registra em cada série
          enum:
          - reps_load
          - reps_only
          - time
          - distance_time
        unilateral:
          type: boolean
      required:
      - custom
      - id
      - modality
      - name
      - secondaryMuscles
      - trackingType
      - unilateral
    FieldProblem:
      type: object
      properties:
        code:
          type: string
          example: min
        field:
          type: string
          example: reps.max
        message:
          type: string
      required:
      - code
      - field
      - message
    GrantConsents:
      type: object
      properties:
        grants:
          type: array
          items:
            $ref: "#/components/schemas/ConsentGrant"
          maxItems: 4
          minItems: 0
      required:
      - grants
    GuardianAuthorizationDecision:
      type: object
      properties:
        approve:
          type: boolean
          description: true = autoriza; false = não autoriza
        docVersion:
          type: string
          maxLength: 50
          minLength: 0
        token:
          type: string
          maxLength: 64
          minLength: 0
      required:
      - approve
      - docVersion
      - token
    GuardianAuthorizationLookup:
      type: object
      properties:
        token:
          type: string
          description: Segredo do link
          maxLength: 64
          minLength: 0
      required:
      - token
    GuardianAuthorizationPreview:
      type: object
      properties:
        docVersion:
          type: string
          description: Versão do termo que a página mostra; volta na decisão
        expiresAt:
          type: string
          format: date-time
        guardianName:
          type: string
        minorFirstName:
          type: string
        relationship:
          type: string
          enum:
          - mother
          - father
          - legal_guardian
          - other
      required:
      - docVersion
      - expiresAt
      - guardianName
      - minorFirstName
      - relationship
    GuardianLink:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
        url:
          type: string
          description: "Link para o responsável abrir no celular dele. Só aparece\
            \ nesta resposta: o app compartilha na hora"
      required:
      - expiresAt
      - url
    GuardianRequest:
      type: object
      properties:
        docVersion:
          type: string
          maxLength: 50
          minLength: 0
        guardianName:
          type: string
          maxLength: 200
          minLength: 0
        relationship:
          type: string
          enum:
          - mother
          - father
          - legal_guardian
          - other
          minLength: 1
      required:
      - docVersion
      - guardianName
      - relationship
    GuardianRequestStatus:
      type: object
      properties:
        guardianName:
          type: string
        linkExpiresAt:
          type:
          - string
          - "null"
          format: date-time
          description: Validade do último link; ausente se recusado
        relationship:
          type: string
          enum:
          - mother
          - father
          - legal_guardian
          - other
        requestedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - pending
          - declined
      required:
      - guardianName
      - relationship
      - requestedAt
      - status
    Invitation:
      type: object
      description: "Convite para compartilhar (link, código ou QR)"
      properties:
        clientId:
          type: string
          format: uuid
        code:
          type: string
          example: K7M2QX9P
        expiresAt:
          type: string
          format: date-time
        linkId:
          type: string
          format: uuid
        url:
          type: string
          example: https://moveup-site.pages.dev/i/K7M2QX9P
      required:
      - clientId
      - code
      - expiresAt
      - linkId
      - url
    InvitePreview:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
        organizationName:
          type: string
          example: Studio Fit
        professionalName:
          type: string
          example: Ana Souza
      required:
      - expiresAt
      - organizationName
      - professionalName
    LegalVersions:
      type: object
      properties:
        consents:
          type: object
          additionalProperties:
            type: string
          description: "Versão vigente por tipo (terms, privacy, health_data, photos)"
        guardianConsent:
          type: string
      required:
      - consents
      - guardianConsent
    Me:
      type: object
      description: Conta do usuário autenticado e o que falta no onboarding
      properties:
        email:
          type: string
          format: email
        guardianConsentRequired:
          type: boolean
          description: "Menor sem autorização do responsável: o app pede antes de\
            \ seguir"
        guardianRequest:
          $ref: "#/components/schemas/GuardianRequestStatus"
          description: Pedido ao responsável aguardando ou recusado; ausente se não
            há (ou já autorizou)
        id:
          type: string
          format: uuid
        lengthUnit:
          type: string
          enum:
          - cm
          - in
        locale:
          type: string
          example: pt-BR
        minor:
          type: boolean
          description: Menor de 18 anos
        missingConsents:
          type: array
          description: Consentimentos obrigatórios ainda não aceitos na versão vigente
          items:
            type: string
            enum:
            - terms
            - privacy
            - health_data
            - photos
        name:
          type: string
        role:
          type:
          - string
          - "null"
          description: Papel da conta; ausente se o cadastro não escolheu
          enum:
          - professional
          - client
        timezone:
          type: string
          example: America/Sao_Paulo
        weightUnit:
          type: string
          enum:
          - kg
          - lb
      required:
      - email
      - guardianConsentRequired
      - id
      - lengthUnit
      - locale
      - minor
      - missingConsents
      - name
      - timezone
      - weightUnit
    MyCoachingLink:
      type: object
      properties:
        linkId:
          type: string
          format: uuid
        organizationName:
          type: string
          example: Studio Fit
        professionalName:
          type: string
          example: Ana Souza
        startedAt:
          type:
          - string
          - "null"
          format: date-time
        status:
          type: string
          enum:
          - pending
          - active
          - inactive
      required:
      - linkId
      - organizationName
      - professionalName
      - status
    NewClient:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        goal:
          type: string
          maxLength: 500
          minLength: 0
        name:
          type: string
          maxLength: 200
          minLength: 0
        phone:
          type: string
          description: WhatsApp com DDI e DDD
          example: +55 11 98765-4321
          maxLength: 30
          minLength: 0
      required:
      - name
    NewExercise:
      type: object
      properties:
        equipment:
          type: string
          maxLength: 60
          minLength: 0
        instructions:
          type: string
          maxLength: 2000
          minLength: 0
        mediaUrl:
          type: string
          maxLength: 500
          minLength: 0
        modality:
          type: string
          enum:
          - strength
          - cardio
          - conditioning
          - complementary
          minLength: 1
        name:
          type: string
          maxLength: 120
          minLength: 0
        primaryMuscle:
          type:
          - string
          - "null"
        secondaryMuscles:
          type: array
          items:
            type: string
          maxItems: 6
          minItems: 0
        trackingType:
          type: string
          enum:
          - reps_load
          - reps_only
          - time
          - distance_time
          minLength: 1
        unilateral:
          type: boolean
          description: "Padrão: false"
      required:
      - modality
      - name
      - trackingType
    PrescribedExercise:
      type: object
      properties:
        exerciseId:
          type: string
          format: uuid
        exerciseName:
          type:
          - string
          - "null"
        notes:
          type: string
        primaryMuscle:
          type:
          - string
          - "null"
        restSeconds:
          type: integer
          format: int32
        sets:
          type: array
          items:
            $ref: "#/components/schemas/PrescribedSet"
        trackingType:
          type:
          - string
          - "null"
          enum:
          - reps_load
          - reps_only
          - time
          - distance_time
      required:
      - exerciseId
      - sets
    PrescribedExerciseInput:
      type: object
      properties:
        exerciseId:
          type: string
          format: uuid
        notes:
          type: string
          maxLength: 500
          minLength: 0
        restSeconds:
          type: integer
          format: int32
        sets:
          type: array
          items:
            $ref: "#/components/schemas/PrescribedSet"
          maxItems: 20
          minItems: 0
      required:
      - exerciseId
    PrescribedSet:
      type: object
      properties:
        distanceM:
          type: integer
          format: int32
        durationSeconds:
          type: integer
          format: int32
        loadKg:
          type: number
          description: Carga em kg (até 3 casas)
        repsMax:
          type: integer
          format: int32
        repsMin:
          type: integer
          format: int32
          description: "Faixa: 8 a 12 = repsMin 8, repsMax 12"
        restSeconds:
          type: integer
          format: int32
        targetRir:
          type: integer
          format: int32
          description: Repetições em reserva 0 a 10
        targetRpe:
          type: number
          description: Esforço alvo 0 a 10 (use RPE ou RIR)
        type:
          type: string
          description: "Padrão: normal"
          enum:
          - warmup
          - normal
          - drop
          - rest_pause
          - failure
    Problem:
      type: object
      description: Erro no formato RFC 9457 (application/problem+json)
      properties:
        code:
          type: string
          description: Código estável (kebab-case) que o app usa para escolher a mensagem
          example: resource-not-found
        detail:
          type: string
          example: Recurso não encontrado.
        errors:
          type: array
          description: Só em erros de validação (400)
          items:
            $ref: "#/components/schemas/FieldProblem"
        instance:
          type: string
          example: /v1/me
        status:
          type: integer
          format: int32
          example: 404
        title:
          type: string
          example: Recurso não encontrado
        traceId:
          type: string
          example: 4bf92f3577b34da6a3ce929d0e0e4736
        type:
          type: string
          example: https://api.moveup.com.br/problems/resource-not-found
      required:
      - code
      - detail
      - status
      - title
      - traceId
      - type
    RegisterAccount:
      type: object
      properties:
        birthDate:
          type: string
          format: date
          description: Obrigatória para aluno (decide se precisa do responsável)
        businessName:
          type: string
          description: Só profissional; vazio usa o nome da pessoa
          maxLength: 120
          minLength: 0
        name:
          type: string
          maxLength: 200
          minLength: 0
        registryNumber:
          type: string
          description: Só profissional; CREF
          maxLength: 30
          minLength: 0
        role:
          type: string
          enum:
          - professional
          - client
          minLength: 1
          pattern: professional|client
      required:
      - name
      - role
    Workout:
      type: object
      properties:
        content:
          $ref: "#/components/schemas/WorkoutContent"
        id:
          type: string
          format: uuid
        name:
          type: string
        programId:
          type:
          - string
          - "null"
          format: uuid
        revision:
          type: integer
          format: int32
          description: Mande em If-Match como "r<revision>"
        sourceTemplateId:
          type:
          - string
          - "null"
          format: uuid
          description: Modelo de origem da cópia
        template:
          type: boolean
          description: Modelo (sem programa)
        versionNumber:
          type: integer
          format: int32
          description: Sobe quando o treino já tinha sessão
      required:
      - content
      - id
      - name
      - revision
      - template
      - versionNumber
    WorkoutBlock:
      type: object
      properties:
        durationSeconds:
          type: integer
          format: int32
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/PrescribedExercise"
        method:
          type: string
        name:
          type: string
        notes:
          type: string
        preset:
          type: string
        restBetweenRounds:
          type: integer
          format: int32
        restSeconds:
          type: integer
          format: int32
        rounds:
          type: integer
          format: int32
        workSeconds:
          type: integer
          format: int32
      required:
      - exercises
      - method
    WorkoutBlockInput:
      type: object
      properties:
        durationSeconds:
          type: integer
          format: int32
          description: EMOM e AMRAP
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/PrescribedExerciseInput"
          maxItems: 12
          minItems: 0
        method:
          type: string
          enum:
          - sequential
          - superset
          - circuit
          - hiit
          - emom
          - amrap
          - intervals
          minLength: 1
        name:
          type: string
          maxLength: 80
          minLength: 0
        notes:
          type: string
          maxLength: 500
          minLength: 0
        preset:
          type:
          - string
          - "null"
          description: Só `tabata` (HIIT 20 s/10 s × 8)
        restBetweenRounds:
          type: integer
          format: int32
        restSeconds:
          type: integer
          format: int32
        rounds:
          type: integer
          format: int32
        workSeconds:
          type: integer
          format: int32
      required:
      - exercises
      - method
    WorkoutContent:
      type: object
      properties:
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/WorkoutBlock"
        estimatedMinutes:
          type: integer
          format: int32
        goal:
          type: string
        notes:
          type: string
      required:
      - blocks
    WorkoutContentInput:
      type: object
      properties:
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/WorkoutBlockInput"
          maxItems: 20
          minItems: 0
        estimatedMinutes:
          type: integer
          format: int32
        goal:
          type: string
          maxLength: 120
          minLength: 0
        notes:
          type: string
          maxLength: 1000
          minLength: 0
      required:
      - blocks
    WorkoutSummary:
      type: object
      properties:
        blocks:
          type: integer
          format: int32
        estimatedMinutes:
          type: integer
          format: int32
        exercises:
          type: integer
          format: int32
        id:
          type: string
          format: uuid
        name:
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
      - blocks
      - exercises
      - id
      - name
      - updatedAt
    WorkoutWrite:
      type: object
      properties:
        content:
          $ref: "#/components/schemas/WorkoutContentInput"
        name:
          type: string
          maxLength: 60
          minLength: 0
      required:
      - content
      - name
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: ID token do Firebase Auth
      scheme: bearer
      type: http
