# Configuração comum. Segredos SEMPRE por variável de ambiente (nada versionado).
spring:
  application:
    name: moveup
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      auto-commit: false
  # Migrations rodam no pipeline, com o papel dono das tabelas (nunca app_api/app_worker).
  # Só o perfil "local" liga o Flyway na subida da aplicação.
  flyway:
    enabled: false

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

# OpenAPI e Swagger UI desligados por padrão (produção); o perfil local liga.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  writer-with-order-by-keys: true # saída estável: o openapi.yaml commitado não muda à toa
  override-with-generic-response: false # erros documentados rota a rota, não todos em todas

moveup:
  auth:
    firebase:
      # Id do projeto do Firebase: o token precisa ter aud = este id e iss = securetoken.google.com/<id>
      project-id: ${FIREBASE_PROJECT_ID}

# Logs em JSON (formato Logstash) com o MDC, onde o Micrometer Tracing põe traceId/spanId.
# Nunca logar corpo de requisição, token, e-mail, nome de aluno ou dado de saúde (CLAUDE.md, regra 7).
logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
