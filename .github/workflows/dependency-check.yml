# Vulnerabilidades conhecidas nas dependências do backend (OWASP dependency-check).
# Semanal e sob demanda: baixa a base do NVD, lento demais para cada push.
# Precisa do secret NVD_API_KEY (chave gratuita em https://nvd.nist.gov/developers/request-an-api-key).
name: dependency-check

on:
  schedule:
    - cron: "0 6 * * 1" # segunda, 3h em Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: dependency-check (falha com CVSS >= 7)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          ./mvnw -B -DskipTests org.owasp:dependency-check-maven:13.0.0:check
          -DnvdApiKey="$(printf %s "$NVD_API_KEY" | tr -d "[:space:]")"
          -DfailBuildOnCVSS=7 -Dformats=HTML,JSON
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.*
