# Atualizações de dependências (BACKEND-PATTERN, seção 13). Expo: atualizar o SDK é tarefa
# própria (npx expo install --fix / expo-upgrade); por isso os pacotes expo/react-native ficam de fora.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # salto de versão maior do Boot/springdoc é migração planejada (muda o BACKEND-PATTERN)
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "jest"
      - dependency-name: "jest-expo"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
