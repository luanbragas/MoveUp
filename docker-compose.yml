# Ambiente LOCAL de desenvolvimento. Nada aqui vai para staging/produção.
# Pré-requisito: copiar .env.example para .env (valores só locais).
name: moveup

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?defina no .env}
      POSTGRES_DB: postgres
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?defina no .env}
      DB_API_PASSWORD: ${DB_API_PASSWORD:?defina no .env}
      DB_WORKER_PASSWORD: ${DB_WORKER_PASSWORD:?defina no .env}
      DB_REPORT_PASSWORD: ${DB_REPORT_PASSWORD:?defina no .env}
    ports:
      # acesso direto: só Flyway (dono das tabelas) e depuração. 15432 no host para não colidir
      # com um Postgres instalado na máquina.
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/local/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moveup"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_API_PASSWORD: ${DB_API_PASSWORD:?defina no .env}
      DB_WORKER_PASSWORD: ${DB_WORKER_PASSWORD:?defina no .env}
      DB_REPORT_PASSWORD: ${DB_REPORT_PASSWORD:?defina no .env}
    # userlist gerado a partir do .env na subida (senhas nunca versionadas)
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '"app_api" "%s"\n"app_worker" "%s"\n"app_report" "%s"\n' \
          "$$DB_API_PASSWORD" "$$DB_WORKER_PASSWORD" "$$DB_REPORT_PASSWORD" > /tmp/userlist.txt
        exec pgbouncer /etc/pgbouncer/pgbouncer.ini
    volumes:
      - ./infra/local/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    ports:
      - "127.0.0.1:6432:6432" # a API e o worker conectam por aqui

  # S3 local (RustFS, compatível com a API do S3, inclusive Object Lock e lifecycle).
  # O MinIO deixou de publicar imagens públicas.
  s3:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?defina no .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?defina no .env}
    ports:
      - "127.0.0.1:9000:9000" # API S3
      - "127.0.0.1:9001:9001" # console
    volumes:
      - s3data:/data

  # Cria os buckets com o aws-cli oficial (o mesmo cliente que vale contra o S3 real).
  s3-init:
    image: amazon/aws-cli:2.37.8
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?defina no .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?defina no .env}
      AWS_DEFAULT_REGION: sa-east-1
      S3_ENDPOINT: http://s3:9000
    volumes:
      - ./infra/local/s3-init.sh:/s3-init.sh:ro
    entrypoint: ["/bin/sh", "/s3-init.sh"]

volumes:
  pgdata:
  s3data:
