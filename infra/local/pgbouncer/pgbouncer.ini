; PgBouncer LOCAL. Mesmo modo da produção (ARQUITETURA.md, seção 4 — Conexões).
[databases]
moveup = host=postgres port=5432 dbname=moveup

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /tmp/userlist.txt

; transaction: compatível com set_config('app.user_id', ?, true) por transação.
pool_mode = transaction
; >= 1.21: suporta prepared statements do driver JDBC em modo transaction.
max_prepared_statements = 200

default_pool_size = 20
max_client_conn = 200
ignore_startup_parameters = extra_float_digits,options
server_reset_query =
admin_users =
